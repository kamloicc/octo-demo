apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-manifests-production
  namespace: argocd
  annotations:
    # Octopus "Update Argo CD Application Manifests" writes rendered templates here
    argo.octopus.com/project: argo-podinfo-manifests
    argo.octopus.com/environment: production
    argo.octopus.com/space: se-industry-demos
spec:
  project: default
  source:
    repoURL: https://github.com/kamloicc/octo-demo.git
    targetRevision: main
    path: gitops/podinfo-manifests/production
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo-manifests-production
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
